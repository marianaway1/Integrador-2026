<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - EUfonia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0F0F80;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: stretch;
      font-family: 'DM Sans', sans-serif;
    }

    /* BARRAS LATERAIS VERDES */
    .side-panel {
      display: none;
      flex: 1 1 0;
      min-width: 40px;
      background-color: #26BD8A;
    }

    @media (min-width: 1000px) {
      .side-panel { display: block; }
    }

    .page-content {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 20px 0 20px;
      gap: 20px;
      min-height: 100vh;
    }

    main.container {
      flex: 1 0 auto;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 0;
    }

    .header {
      width: 100%;
      background: linear-gradient(180deg, #32D29A 0%, #26BD8A 50%, #1DA375 100%);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      min-height: 70px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.3), inset 0 2px 3px rgba(255,255,255,0.6);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .header-logo img {
      height: 44px;
      width: 44px;
      object-fit: contain;
      border-radius: 50%;
      background: #ffffff;
      padding: 2px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    .header-logo span {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      color: #ffffff;
      font-size: 22px;
      letter-spacing: -0.5px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }

    .header-nav a {
      display: flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: #ffffff;
      font-size: 14px;
      font-weight: 500;
      transition: 0.2s;
      opacity: 0.9;
    }

    .header-nav a:hover {
      opacity: 1;
      color: #ff6b3b;
      text-shadow: 0 0 8px rgba(255,107,59,0.4);
    }


    .c {
      width: 100%;
      max-width: 1000px;
      min-height: 520px;
      background-color: #26BD8A;
      border-radius: 20px;
      display: flex;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .esquerda {
      width: 40%;
      background-color: #E85200;
      display: flex;
      justify-content: center;
      text-align: center;
      align-items: center;
      padding: 30px;
      overflow: hidden;
    }

    .logo-peixe {
      max-width: 280px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
    }

    .direita {
      width: 60%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px;
    }

    .login {
      width: 100%;
      max-width: 320px;
    }

    .login h2 {
      font-family: 'Syne', sans-serif;
      font-weight: bold;
      font-size: 38px;
      margin-bottom: 10px;
      color: #E85200;
    }

    .login p {
      color: #ffffff;
      margin-bottom: 25px;
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      margin-bottom: 6px;
      color: #ffffff;
      font-size: 14px;
    }

    .input-group input {
      width: 100%;
      padding: 12px 14px;
      border: none;
      border-radius: 10px;
      outline: none;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      transition: 0.3s;
    }

    .input-group input:focus {
      box-shadow: 0 0 10px #E85200;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #E85200;
      color: white;
      font-size: 16px;
      font-family: 'DM Sans', sans-serif;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #cc4700;
      transform: scale(1.02);
      box-shadow: 0 0 10px rgba(232, 82, 0, 0.5);
    }

    .register {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: white;
    }

    .register a {
      color: #E85200;
      text-decoration: none;
      font-weight: bold;
    }

    #mensagem {
      margin-top: 15px;
      text-align: center;
      color: #0F0F80;
      font-weight: bold;
      font-size: 14px;
    }

    /* FOOTER */
    .footer {
      width: 100%;
      background-color: #26BD8A;
      border-radius: 18px 18px 0 0;
      padding: 20px 30px;
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .footer-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .footer-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .footer-brand img {
      height: 32px;
      width: 32px;
      border-radius: 50%;
      background: #ffffff;
      padding: 2px;
    }

    .footer-brand span {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      color: #ffffff;
      font-size: 18px;
    }

    .footer-links a {
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      margin-left: 15px;
    }

    .footer-bottom {
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      padding-top: 12px;
      text-align: center;
      color: #ffffff;
      font-size: 12px;
    }

    @media(max-width:850px) {
      .c { flex-direction: column; }
      .esquerda, .direita { width: 100%; }
      .esquerda { min-height: 180px; }
      .direita { padding: 30px 20px; }
    }
  </style>
</head>
<body>

  <!-- BARRA LATERAL ESQUERDA -->
  <div class="side-panel"></div>

  <div class="page-content">

    <!-- HEADER -->
    <header class="header">
      <a href="index.html" class="header-logo">
        <img src="logopeixinho.png" alt="Logo EUfonia">
        <span>EUfonia</span>
      </a>

      <nav class="header-nav">
        <a href="index.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          <span>Início</span>
        </a>
      </nav>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="container">
      <div class="c">
        <div class="esquerda">
          <img src="logopeixinho.png" class="logo-peixe" alt="Logo EUfonia">
        </div>

        <div class="direita">
          <div class="login">
            <h2>EUfonia</h2>
            <p>Enviaremos um código para o seu E-mail.</p>

            <div class="input-group">
              <label for="usuario">E-mail</label>
              <input type="text" id="usuario" placeholder="Digite seu E-mail">
            </div>

            <button onclick="enviar()">Enviar</button>

            <div id="mensagem"></div>
          </div>
        </div>
      </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
      <div class="footer-content">
        <div class="footer-brand">
          <img src="logopeixinho.png" alt="Logo EUfonia">
          <span>EUfonia</span>
        </div>
        <div class="footer-links">
          <a href="#">Sobre nós</a>
          <a href="#">Termos de Uso</a>
        </div>
      </div>
      <div class="footer-bottom">&copy; 2026 EUfonia. Todos os direitos reservados.</div>
    </footer>

  </div>

  <!-- BARRA LATERAL DIREITA -->
  <div class="side-panel"></div>

  <script>
   function enviar() {
    console.log("enviar() foi chamada");

    let usuarioDigitado = document.getElementById("usuario").value.trim().toLowerCase();
    let mensagem = document.getElementById("mensagem");
    let regexEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (regexEmail.test(usuarioDigitado)) {
        window.alert("Acabamos de enviar um código para o seu E-mail!");
        window.location.href = "VerificarCodigo.html";
        return;
    } else {
        mensagem.style.color = "#0F0F80";
        mensagem.innerHTML = "E-mail inválido.";
        return;
    }
}
  </script>

</body>
</html>
