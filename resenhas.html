
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Resenha - EUfonia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
 
    body {
      background-color: #0F0F80;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: stretch;
      font-family: 'DM Sans', sans-serif;
    }
 
    .side-panel {
      display: none;
      flex: 1 1 0;
      min-width: 40px;
      background-color: #26BD8A;
    }
 
    @media (min-width: 1000px) {
      .side-panel { display: block; }
    }
 
    .page-content {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 20px 0 20px;
      gap: 20px;
      min-height: 100vh;
    }
 
    /* HEADER */
    .header {
      width: 100%;
      background: linear-gradient(180deg, #32D29A 0%, #26BD8A 50%, #1DA375 100%);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 18px 36px;
      min-height: 90px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.3), inset 0 2px 3px rgba(255,255,255,0.6);
      border: 1px solid rgba(255, 255, 255, 0.4);
      position: relative;
      position: sticky;
      top: 20px;
      z-index: 100;
    }
 
    .header-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      flex-shrink: 0;
    }
 
    .header-logo img {
      height: 58px;
      width: 58px;
      object-fit: contain;
      border-radius: 50%;
      background: #ffffff;
      padding: 3px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
 
    .header-logo span {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      color: #ffffff;
      font-size: 28px;
      letter-spacing: -0.5px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }
 
    .header-search-container {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1 1 240px;
      max-width: 460px;
      margin: 0 20px;
    }
 
    .search-box {
      display: flex;
      align-items: center;
      background: #ffffff;
      border-radius: 22px;
      padding: 10px 18px;
      width: 100%;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.15);
    }
 
    .search-box input {
      border: none;
      outline: none;
      width: 100%;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      color: #333;
    }
 
    .header-nav {
      display: flex;
      align-items: center;
      gap: 24px;
      flex-shrink: 0;
    }
 
    .header-nav a {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: #ffffff;
      font-family: 'DM Sans', sans-serif;
      font-size: 17px;
      font-weight: 700;
      transition: 0.2s;
      opacity: 0.95;
    }
 
    .header-nav a:hover,
    .header-nav a.active {
      opacity: 1;
      color: #ff6c17;
      text-shadow: 0 0 8px rgba(255,255,255,0.6);
    }
 
    .header-nav a svg {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      width: 22px;
      height: 22px;
    }
 
    main.container {
      flex: 1 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 0 0 20px 0;
    }
 
     .back-btn {
      color: #ffffff;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 20px;
      margin-bottom: 5px;
      transition: transform 0.2s;
      width: fit-content;
    }
 
    .back-btn:hover {
      transform: translateX(-4px);
    }
 
    .c {
      width: 100%;
      min-height: 560px;
      border-radius: 20px;
      display: flex;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
 
    .principal {
      width: 60%;
      background-color: #0F0F80;
      padding: 36px;
      display: flex;
    }
 
    .card-principal {
      width: 100%;
      background-color: #3737A6;
      border-radius: 16px;
      padding: 26px;
      display: flex;
      flex-direction: column;
    }
 
    .usuario-info {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
 
    .avatar {
      width: 34px;
      height: 34px;
      min-width: 34px;
      border-radius: 50%;
      background-color: #26BD8A;
      display: flex;
      align-items: center;
      justify-content: center;
    }
 
    .avatar svg {
      width: 18px;
      height: 18px;
      fill: #ffffff;
    }
 
    .nome-usuario {
      color: #ffffff;
      font-weight: 700;
      font-size: 15px;
    }
 
    .estrelas {
      color: #26BD8A;
      font-size: 18px;
      letter-spacing: 2px;
      margin-bottom: 16px;
    }
 
    .estrelas .vazia {
      color: rgba(255, 255, 255, 0.35);
    }
 
    .texto-resenha {
      color: #E7E7FA;
      font-size: 15px;
      line-height: 1.7;
    }
 
    .texto-resenha p + p {
      margin-top: 12px;
    }
 
    .rodape-card {
      display: flex;
      gap: 22px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.15);
    }
 
    .rodape-card span {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #ffffff;
      font-size: 14px;
    }
 
    .rodape-card svg {
      width: 17px;
      height: 17px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
 
    .lista-resenhas {
      width: 40%;
      background-color: #E85200;
      padding: 30px 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }
 
    .lista-resenhas::-webkit-scrollbar {
      width: 6px;
    }
 
    .lista-resenhas::-webkit-scrollbar-thumb {
      background-color: rgba(255,255,255,0.4);
      border-radius: 10px;
    }
 
    .mini-card {
      background-color: #F1794A;
      border-radius: 14px;
      padding: 16px 18px;
      transition: 0.25s;
    }
 
    .mini-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(0,0,0,0.2);
    }
 
    .mini-usuario {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
 
    .mini-avatar {
      width: 24px;
      height: 24px;
      min-width: 24px;
      border-radius: 50%;
      background-color: #26BD8A;
      display: flex;
      align-items: center;
      justify-content: center;
    }
 
    .mini-avatar svg {
      width: 13px;
      height: 13px;
      fill: #ffffff;
    }
 
    .mini-usuario span {
      color: #ffffff;
      font-weight: 700;
      font-size: 14px;
    }
 
    .mini-estrelas {
      color: #26BD8A;
      font-size: 14px;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
 
    .mini-estrelas .vazia {
      color: rgba(255,255,255,0.4);
    }
 
    .mini-texto {
      color: #FFE7DA;
      font-size: 13.5px;
      line-height: 1.55;
    }
 
    .footer {
      width: 100%;
      background-color: #26BD8A;
      border-radius: 18px 18px 0 0;
      padding: 20px 30px;
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
 
    .footer-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }
 
    .footer-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
 
    .footer-brand img {
      height: 32px;
      width: 32px;
      border-radius: 50%;
      background: #ffffff;
      padding: 2px;
    }
 
    .footer-brand span {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      color: #ffffff;
      font-size: 18px;
    }
 
    .footer-links a {
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      margin-left: 15px;
    }
 
    .footer-bottom {
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      padding-top: 12px;
      text-align: center;
      color: #ffffff;
      font-size: 12px;
    }
 
    @media (max-width: 850px) {
      .c { flex-direction: column; }
      .principal, .lista-resenhas { width: 100%; }
      .principal { padding: 24px; }
      .lista-resenhas { padding: 24px 20px; max-height: 480px; }
    }
  </style>
</head>
